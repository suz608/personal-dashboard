      <mat-icon class="icon" fontIcon="bookmark_outline"></mat-icon>
    </div>
  </a>

  <a routerLink="todos" routerLinkActive="selected" class="tab todos-tab">
    <div class="tile tile2">
      <mat-icon class="icon" fontIcon="checklist_rtl"></mat-icon>

  <a routerLink="timer" routerLinkActive="selected" class="tab notes-tab">

  <a routerLink="settings" routerLinkActive="selected" class="tab settings-tab">
